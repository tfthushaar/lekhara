[project]
name = "horus-api"
version = "0.1.0"
description = "Horus API: obligations, money truth and escrow engines for Karnataka real estate projects"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "alembic>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13", "ruff>=0.17"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["horus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
