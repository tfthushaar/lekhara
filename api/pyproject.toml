[project]
name = "lekhara-api"
version = "0.1.0"
description = "Lekhara API: obligations, money truth and escrow engines for Karnataka real estate projects"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "alembic>=1.16",
    "python-multipart>=0.0.20",
    "pypdf>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "cryptography>=43",
    "defusedxml>=0.7",
    "webauthn>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13", "ruff>=0.17", "xlwt>=1.3"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lekhara*"]

[tool.setuptools.package-data]
lekhara = ["migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"lekhara/migrations/versions/*" = ["E501"]
"tests/tally_samples.py" = ["E501"]
