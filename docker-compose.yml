# Local Postgres for development. The API uses SQLite unless LEKHARA_DATABASE_URL is set.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lekhara
      POSTGRES_PASSWORD: lekhara
      POSTGRES_DB: lekhara
    ports:
      - "5432:5432"
    volumes:
      - lekhara-db:/var/lib/postgresql/data

volumes:
  lekhara-db:
